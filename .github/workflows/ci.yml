name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: extractions/setup-just@v3
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./tool/bootstrap.go commit-check "$env:PR_TITLE"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Run the same local quality gate
        run: just check
        env:
          LEDGER_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
      - name: Verify committed generated files and lockfile
        run: git diff --exit-code -- pubspec.lock lib/l10n/generated
      - name: Classify pull request changes
        if: github.event_name == 'pull_request'
        id: changes
        run: go run ./tool/bootstrap.go changes --base "origin/${{ github.base_ref }}" --github-output "$env:GITHUB_OUTPUT"
        shell: pwsh
      - name: Require independent code review evidence
        if: github.event_name == 'pull_request' && (steps.changes.outputs.code == 'true' || steps.changes.outputs.policy == 'true')
        run: just review-check
      - name: Require matched UI change evidence
        if: github.event_name == 'pull_request' && steps.changes.outputs.visual == 'true'
        run: just ui-report .governance/ui.json
      - name: Retain coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}
          path: |
            coverage/
            .governance/reports/
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: go run ./tool/bootstrap.go bootstrap
      # Without this, ubuntu-latest sees /dev/kvm but cannot open it, so the
      # emulator falls back to software accel (~7+ min boot) and post-boot adb
      # settings/input commands race with Broken pipe before the smoke script.
      # udev MODE=0666 alone often does not grant the current runner session
      # write access; chmod applies the same mode in-session after diagnostics.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo 'error: /dev/kvm is missing; nested virtualization is required for Android emulator hardware acceleration' >&2
            exit 1
          fi
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ]; then
            echo 'error: /dev/kvm is not readable by the runner after chmod 666' >&2
            exit 1
          fi
          if [ ! -w /dev/kvm ]; then
            echo 'error: /dev/kvm is not writable by the runner after chmod 666' >&2
            exit 1
          fi
      - name: Run deterministic native smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # The action always runs `adb shell input keyevent 82` once after
          # boot_completed (cannot be disabled). KVM above is what keeps that
          # unlock from Broken-piping. disable-animations only gates the three
          # settings puts; we skip them here and apply them with retries below
          # once the package manager answers, so a brief settings race does not
          # kill the job before smoke.
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            serial=emulator-5554
            i=0
            while [ "$i" -lt 90 ]; do
              if adb -s "$serial" shell 'pm path android' >/dev/null 2>&1; then
                break
              fi
              i=$((i + 1))
              sleep 2
            done
            adb -s "$serial" shell 'pm path android' >/dev/null
            attempt=0
            while [ "$attempt" -lt 8 ]; do
              if adb -s "$serial" shell settings put global window_animation_scale 0.0 \
                && adb -s "$serial" shell settings put global transition_animation_scale 0.0 \
                && adb -s "$serial" shell settings put global animator_duration_scale 0.0; then
                break
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            if [ "$attempt" -ge 8 ]; then
              echo "adb settings still unavailable after retries" >&2
              exit 1
            fi
            go run ./tool/bootstrap.go android-smoke -d "$serial"

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: go run ./tool/bootstrap.go bootstrap
      - name: Run deterministic native smoke on a named simulator
        run: go run ./tool/bootstrap.go ios-smoke
      - name: Shut down the ephemeral simulator
        if: always()
        run: xcrun simctl shutdown Ledger-CI
      - name: Delete the ephemeral simulator
        if: always()
        run: xcrun simctl delete Ledger-CI
