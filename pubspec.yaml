name: ledger_app
description: "Ledger personal finance client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.7'

dependencies:
  # Charting for a later reporting phase; no widget imports it yet.
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.2
  lucide_icons_flutter: 3.1.19
  # Provides the platform-agnostic Override type used by provider overrides.
  riverpod: ^3.2.1
  sentry_flutter: ^9.30.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.local
    - assets/reference/
    - assets/reference/currencies/
    - assets/reference/currencies/locales/
    - assets/fonts/inter/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
